name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # npm (not Bun) runs `changeset publish`, so Node + npm are still needed here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing requires npm >= 11.5.1 (OIDC + provenance).
      - name: Install npm for trusted publishing
        run: npm install -g npm@11.5.1

      - run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          # Use a package script so `&&` runs in a shell (changesets/action uses exec without shell).
          publish: bun run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty string prevents changesets/action from writing an npm token to .npmrc
          # so npm can authenticate via GitHub OIDC (trusted publishing).
          NPM_TOKEN: ""
          NPM_CONFIG_PROVENANCE: "true"
